; Docker daemon. Optional — removed by entrypoint unless ENABLE_DOCKER=1.
[program:dockerd]
command=dockerd --host=unix:///var/run/docker.sock --storage-driver=vfs
autorestart=true
startsecs=10
startretries=9999
stdout_logfile=/var/log/supervisor/dockerd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true
