; Clawdi controller — auth proxy + management routes on port 18789.
; Starts first (priority=10) so health probes are available immediately.
[program:controller]
command=node /usr/local/bin/controller.js
priority=10
autorestart=true
startsecs=3
startretries=9999
stdout_logfile=/var/log/supervisor/controller.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true
