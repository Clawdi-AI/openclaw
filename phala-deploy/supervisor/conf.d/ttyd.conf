; ttyd — headless PTY server on localhost:7681.
; No auth — controller handles authentication before proxying.
[program:ttyd]
command=ttyd -p 7681 -i 127.0.0.1 -W zsh
priority=20
autorestart=true
startsecs=3
startretries=9999
stdout_logfile=/var/log/supervisor/ttyd.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true
