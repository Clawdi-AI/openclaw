; ttyd — web terminal over WebSocket on port 18792.
; Auth token is resolved at runtime from the GATEWAY_AUTH_TOKEN env var.
[program:ttyd]
command=ttyd -p 18792 -W -c admin:%(ENV_GATEWAY_AUTH_TOKEN)s bash
autorestart=true
startsecs=3
startretries=9999
stdout_logfile=/data/openclaw/logs/ttyd.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true
