; OpenClaw gateway — the core agent runtime.
; killasgroup/stopasgroup ensures orphaned children are cleaned up on restart.
; startsecs=30: crash loops within 30s trigger supervisord's exponential backoff.
[program:gateway]
command=openclaw gateway run --bind lan --port 18789 --force
autorestart=true
startsecs=30
startretries=9999
stdout_logfile=/data/openclaw/logs/gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=1
redirect_stderr=true
stopwaitsecs=10
killasgroup=true
stopasgroup=true
