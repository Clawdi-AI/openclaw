; File Browser — web file manager + REST API on port 18791.
; Config/users are set up by entrypoint.sh before supervisord starts.
[program:filebrowser]
command=filebrowser --database /data/.filebrowser.db
autorestart=true
startsecs=5
startretries=9999
stdout_logfile=/data/openclaw/logs/filebrowser.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true
