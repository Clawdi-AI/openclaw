services:
  mux-server:
    image: h4x3rotab/openclaw-mux@sha256:cfe6eda026525ed31f784e725fe7d0b1788febea78f5c2e97444d7d00c02f711
    container_name: mux-server
    expose:
      - "18891"
    environment:
      MUX_HOST: 0.0.0.0
      MUX_PORT: 18891
      MUX_DB_PATH: /data/mux/mux-server.sqlite
      MUX_LOG_PATH: /dev/stdout
      MUX_IDEMPOTENCY_TTL_MS: 600000
      # Shared key used only for POST /v1/instances/register (runtime JWT minting).
      MUX_REGISTER_KEY: ${MUX_REGISTER_KEY:?set MUX_REGISTER_KEY}
      # Control-plane key for /v1/admin/* endpoints.
      MUX_ADMIN_TOKEN: ${MUX_ADMIN_TOKEN:?set MUX_ADMIN_TOKEN}
      MUX_OPENCLAW_ACCOUNT_ID: "mux"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN}
      MUX_TELEGRAM_BOOTSTRAP_LATEST: "true"
      MUX_DISCORD_BOOTSTRAP_LATEST: "true"
      MUX_WHATSAPP_ACCOUNT_ID: "default"
      MUX_WHATSAPP_AUTH_DIR: "/root/.openclaw/credentials/whatsapp/default"
    volumes:
      - mux_data:/data
      - mux_credentials:/root/.openclaw/credentials
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18891/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  mux-proxy:
    image: nginx:1.27-alpine
    container_name: mux-proxy
    depends_on:
      mux-server:
        condition: service_healthy
    ports:
      - "18891:18891"
    configs:
      - source: mux_proxy_nginx_conf
        target: /etc/nginx/nginx.conf
      - source: mux_proxy_htpasswd_prometheus
        target: /etc/nginx/htpasswd-prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18891/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  mux_data:
  mux_credentials:

configs:
  mux_proxy_nginx_conf:
    content: |
      events {}
      http {
        limit_req_zone $$binary_remote_addr zone=mux_public:10m rate=20r/s;
        limit_req_zone $$binary_remote_addr zone=mux_admin:10m rate=5r/s;

        server {
          listen 18891;
          # Align with mux-server default MUX_MAX_BODY_BYTES (50 MiB).
          client_max_body_size 50m;
          client_body_timeout 15s;
          client_header_timeout 15s;
          send_timeout 35s;
          keepalive_timeout 30s;
          proxy_http_version 1.1;
          # OpenClaw outbound mux client defaults to ~30s timeout. Keep proxy slightly above it.
          proxy_connect_timeout 5s;
          proxy_send_timeout 35s;
          proxy_read_timeout 35s;

          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;

          location = /health {
            proxy_pass http://mux-server:18891;
          }
          location = /health/live {
            proxy_pass http://mux-server:18891;
          }
          location = /health/ready {
            proxy_pass http://mux-server:18891;
          }

          location = /metrics {
            auth_basic "mux-metrics";
            auth_basic_user_file /etc/nginx/htpasswd-prometheus;
            limit_req zone=mux_admin burst=10 nodelay;
            proxy_pass http://mux-server:18891;
          }

          location ^~ /v1/admin/ {
            limit_req zone=mux_admin burst=20 nodelay;
            proxy_pass http://mux-server:18891;
          }

          location / {
            limit_req zone=mux_public burst=60 nodelay;
            proxy_pass http://mux-server:18891;
          }
        }
      }
  mux_proxy_htpasswd_prometheus:
    content: |
      prometheus:${MUX_PROXY_PROMETHEUS_PASSWORD_HASH:?set MUX_PROXY_PROMETHEUS_PASSWORD_HASH}
