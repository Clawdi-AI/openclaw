services:
  mux-server:
    image: h4x3rotab/openclaw-mux@sha256:cfe6eda026525ed31f784e725fe7d0b1788febea78f5c2e97444d7d00c02f711
    container_name: mux-server
    expose:
      - "18891"
    environment:
      MUX_HOST: 0.0.0.0
      MUX_PORT: 18891
      MUX_DB_PATH: /data/mux/mux-server.sqlite
      MUX_LOG_PATH: /dev/stdout
      MUX_IDEMPOTENCY_TTL_MS: 600000
      # Shared key used only for POST /v1/instances/register (runtime JWT minting).
      MUX_REGISTER_KEY: ${MUX_REGISTER_KEY:?set MUX_REGISTER_KEY}
      # Control-plane key for /v1/admin/* endpoints.
      MUX_ADMIN_TOKEN: ${MUX_ADMIN_TOKEN:?set MUX_ADMIN_TOKEN}
      MUX_OPENCLAW_ACCOUNT_ID: "mux"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?set DISCORD_BOT_TOKEN}
      MUX_TELEGRAM_BOOTSTRAP_LATEST: "true"
      MUX_DISCORD_BOOTSTRAP_LATEST: "true"
      MUX_WHATSAPP_ACCOUNT_ID: "default"
      MUX_WHATSAPP_AUTH_DIR: "/root/.openclaw/credentials/whatsapp/default"
    volumes:
      - mux_data:/data
      - mux_credentials:/root/.openclaw/credentials
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18891/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  mux-proxy:
    image: nginx:1.27-alpine
    container_name: mux-proxy
    depends_on:
      mux-server:
        condition: service_healthy
    ports:
      - "18891:18891"
    environment:
      # Bcrypt/htpasswd hash for /metrics (username: prometheus).
      MUX_PROXY_PROMETHEUS_PASSWORD_HASH: ${MUX_PROXY_PROMETHEUS_PASSWORD_HASH:?set MUX_PROXY_PROMETHEUS_PASSWORD_HASH}
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        : "${MUX_PROXY_PROMETHEUS_PASSWORD_HASH:?set MUX_PROXY_PROMETHEUS_PASSWORD_HASH}"
        cat >/etc/nginx/htpasswd-prometheus <<EOF_PROM
        prometheus:${MUX_PROXY_PROMETHEUS_PASSWORD_HASH}
        EOF_PROM
        exec nginx -g 'daemon off;'
    configs:
      - source: mux_proxy_nginx_conf
        target: /etc/nginx/nginx.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18891/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  mux_data:
  mux_credentials:

configs:
  mux_proxy_nginx_conf:
    file: ./nginx.conf
