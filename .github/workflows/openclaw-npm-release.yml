name: OpenClaw Release Tarball

on:
  push:
    tags:
      - "v*"

concurrency:
  group: openclaw-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10.23.0"

jobs:
  publish_release_tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "false"
          use-sticky-disk: "false"

      - name: Build
        run: pnpm build

      - name: Build Control UI
        run: pnpm ui:build

      - name: Pack and upload release tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACK_OUT="$(npm pack --pack-destination /tmp)"
          TGZ_PATH="/tmp/$(printf '%s\n' "$PACK_OUT" | tail -n 1 | tr -d '[:space:]')"
          mv -f "$TGZ_PATH" /tmp/openclaw.tgz

          TAG="${GITHUB_REF_NAME}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          gh release create "$TAG" --title "openclaw $PACKAGE_VERSION" --notes "" 2>/dev/null || true
          gh release upload "$TAG" /tmp/openclaw.tgz --clobber
