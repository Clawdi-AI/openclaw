name: Docker Test Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish (leave empty to use sanitized branch name)"
        required: false
        default: ""
        type: string
      target:
        description: "Dockerfile target"
        required: true
        default: "full"
        type: choice
        options:
          - base
          - full
      push:
        description: "Push built image to GHCR"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-test-publish-${{ github.ref }}-${{ inputs.image_tag || 'auto' }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name and tag
        id: image
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"

          raw_tag="${INPUT_IMAGE_TAG:-}"
          if [ -z "$raw_tag" ]; then
            raw_tag="${GITHUB_REF_NAME}"
          fi

          safe_tag="$(printf '%s' "$raw_tag" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##; s#-+#-#g')"
          safe_tag="${safe_tag:0:128}"
          if [ -z "$safe_tag" ]; then
            safe_tag="test-build"
          fi

          echo "value=${image_name}" >> "$GITHUB_OUTPUT"
          echo "tag=${safe_tag}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw
        run: pnpm build

      - name: Build UI
        run: pnpm ui:install && pnpm ui:build

      - name: Pack tarball for Docker build context
        run: |
          PACK_OUT="$(npm pack --pack-destination phala-deploy)"
          TGZ_NAME="$(printf '%s\n' "$PACK_OUT" | tail -n 1 | tr -d '[:space:]')"
          mv -f "phala-deploy/$TGZ_NAME" phala-deploy/openclaw.tgz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: phala-deploy/Dockerfile
          target: ${{ inputs.target }}
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.image.outputs.value }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "Image: ${{ steps.image.outputs.value }}:${{ steps.image.outputs.tag }}"
          echo "Published: ${{ inputs.push }}"
          echo "Digest: ${{ steps.docker.outputs.digest }}"
