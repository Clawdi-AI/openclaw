name: Docker Test Build

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (e.g. proxy-test)"
        required: true
        default: "proxy-test"
      target:
        description: "Dockerfile target (base or dev)"
        required: true
        default: "base"
        type: choice
        options:
          - base
          - dev

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize image name to lowercase
        run: echo "IMAGE_LC=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw
        run: pnpm build

      - name: Build UI
        run: pnpm ui:install && pnpm ui:build

      - name: Pack tarball
        run: |
          PACK_OUT="$(npm pack --pack-destination phala-deploy)"
          TGZ_NAME="$(printf '%s\n' "$PACK_OUT" | tail -n 1 | tr -d '[:space:]')"
          mv -f "phala-deploy/$TGZ_NAME" phala-deploy/openclaw.tgz

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: phala-deploy/Dockerfile
          target: ${{ inputs.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_LC }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
