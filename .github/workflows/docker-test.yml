name: Docker Test Build

on:
  pull_request:
    paths:
      - "phala-deploy/**"
      - ".github/workflows/docker-test.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (used only for manual pushes)"
        required: true
        default: "proxy-test"
      target:
        description: "Dockerfile target (base or full)"
        required: true
        default: "full"
        type: choice
        options:
          - base
          - full

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [base, full]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw
        run: pnpm build

      - name: Build UI
        run: pnpm ui:install && pnpm ui:build

      - name: Pack tarball
        run: |
          PACK_OUT="$(npm pack --pack-destination phala-deploy)"
          TGZ_NAME="$(printf '%s\n' "$PACK_OUT" | tail -n 1 | tr -d '[:space:]')"
          mv -f "phala-deploy/$TGZ_NAME" phala-deploy/openclaw.tgz

      - name: Build Docker image (${{ matrix.target }})
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --file phala-deploy/Dockerfile \
            --target "${{ matrix.target }}" \
            --platform linux/amd64 \
            --provenance=false \
            --cache-from type=gha,scope=phala-${{ matrix.target }} \
            --cache-to type=gha,mode=max,scope=phala-${{ matrix.target }} \
            .

  build-and-push:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build OpenClaw
        run: pnpm build

      - name: Build UI
        run: pnpm ui:install && pnpm ui:build

      - name: Pack tarball
        run: |
          PACK_OUT="$(npm pack --pack-destination phala-deploy)"
          TGZ_NAME="$(printf '%s\n' "$PACK_OUT" | tail -n 1 | tr -d '[:space:]')"
          mv -f "phala-deploy/$TGZ_NAME" phala-deploy/openclaw.tgz

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: phala-deploy/Dockerfile
          target: ${{ inputs.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
